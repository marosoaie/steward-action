# The README's workflow, with `uses: ./` for the pull request's own version
# of the Action: it runs Dangerfile/ and posts the pull request's one
# summary comment.
name: Steward

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./

  # The README says `pull-requests: write` is the only permission Steward
  # needs for its comment. These jobs check it, and run only when the pull
  # request has the check-permissions label, since every probe's comment
  # notifies the pull request's participants. Adding the label doesn't
  # start them: the next push or edit of the pull request does. A `labeled`
  # trigger would run this workflow on every label, and its concurrency
  # group would cancel the Steward job in progress. They run after
  # `steward`, in its run, so only one job posts at a time. A fork's or
  # Dependabot's pull request gets a read-only token whatever the job asks
  # for, so they don't run there.
  pull-requests-write:
    needs: steward
    if: ${{ !cancelled() && contains(github.event.pull_request.labels.*.name, 'check-permissions') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create, update and delete a comment
        run: tests/comments.sh probe allowed
      - name: Plant two summary comments
        id: plant
        run: tests/comments.sh plant
      # Updates the oldest summary and deletes the others, the newer planted
      # one among them. Fails when the pull request has failures, which this
      # job doesn't check.
      - uses: ./
        continue-on-error: true
        with:
          report-artifact: steward-report-pull-requests-write
      - name: Check that Steward deleted it
        run: tests/comments.sh gone "$PLANTED"
        env:
          PLANTED: ${{ steps.plant.outputs.id }}

  # GitHub's REST documentation lists `issues: write` as enough too, but on
  # a pull request the workflow's token gets 403, "Resource not accessible
  # by integration" (run 40567615423).
  issues-write:
    needs: steward
    if: ${{ !cancelled() && contains(github.event.pull_request.labels.*.name, 'check-permissions') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail to create a comment
        run: tests/comments.sh probe forbidden
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  pull-requests-read:
    needs: steward
    if: ${{ !cancelled() && contains(github.event.pull_request.labels.*.name, 'check-permissions') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail to create a comment
        run: tests/comments.sh probe forbidden
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  # A Dangerfile that doesn't finish leaves a summary comment saying so, and
  # the next run that reports replaces it (the README's "When the
  # Dangerfile doesn't finish"). It posts, so it runs as the permission
  # checks do: with the label, on this repository's own pull requests, and
  # after them. Each run's outcome must be failure, the job's status
  # without continue-on-error. ci.yml checks what needs no write on every
  # pull request.
  unfinished:
    needs: pull-requests-write
    if: ${{ !cancelled() && contains(github.event.pull_request.labels.*.name, 'check-permissions') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # So that the crash creates the summary comment.
      - name: Delete the summary comment
        run: tests/comments.sh clear

      - id: crash
        uses: ./
        continue-on-error: true
        env:
          STOP: crash
        with:
          package-path: tests/unfinished
          product: Stops
          report-artifact: steward-report-crash
      - name: Check the comment a crash leaves
        id: crashed
        run: |
          test "$OUTCOME" = failure
          tests/comments.sh says "Steward didn't finish** on ${COMMIT:0:7}:" "the Dangerfile was stopped by SIG"
        env:
          OUTCOME: ${{ steps.crash.outcome }}

      - id: broken
        uses: ./
        continue-on-error: true
        env:
          STOP: '2'
        with:
          package-path: tests/unfinished
          product: Stops
          report-artifact: steward-report-broken
      - name: Check the comment a broken run leaves
        run: |
          test "$OUTCOME" = failure
          tests/comments.sh says "on ${COMMIT:0:7}: the Dangerfile exited with status 2,"
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          ID: ${{ steps.crashed.outputs.id }}

      - id: unbuilt
        uses: ./
        continue-on-error: true
        with:
          package-path: tests/unfinished
          product: Broken
          report-artifact: steward-report-unbuilt
      - name: Check the comment a Dangerfile that doesn't build leaves
        run: |
          test "$OUTCOME" = failure
          tests/comments.sh says "on ${COMMIT:0:7}: the Dangerfile didn't build."
        env:
          OUTCOME: ${{ steps.unbuilt.outcome }}
          ID: ${{ steps.crashed.outputs.id }}

      # As Steward does when it posts and then can't finish.
      - id: touched
        uses: ./
        continue-on-error: true
        env:
          STOP: touch
        with:
          package-path: tests/unfinished
          product: Stops
          report-artifact: steward-report-touched
      - name: Check that a comment written during the run is left alone
        run: |
          test "$OUTCOME" = failure
          tests/comments.sh says "Planted by a Dangerfile"
        env:
          OUTCOME: ${{ steps.touched.outcome }}
          ID: ${{ steps.crashed.outputs.id }}

      # Last whatever failed above, so the pull request keeps the real
      # summary. Fails when the pull request has failures, which this job
      # doesn't check.
      - if: ${{ !cancelled() }}
        uses: ./
        continue-on-error: true
        with:
          report-artifact: steward-report-unfinished
      - name: Check that Steward replaced the same comment
        run: tests/comments.sh kept "$ID"
        env:
          ID: ${{ steps.crashed.outputs.id }}
