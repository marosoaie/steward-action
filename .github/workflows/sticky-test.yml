# Deliberate findings for testing the summary comment: actions pinned to
# a tag and a branch. It never runs (workflow_dispatch only), and the
# test's last push deletes it.
name: Sticky comment test

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@main
        with:
          path: x
          key: x
